name: Deploy Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to embed (e.g. 1.0.3). Falls back to Maven Central if empty.'
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to embed'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Javadoc
        run: ./gradlew javadoc --no-daemon

      - name: Install site deps
        working-directory: ./site
        run: npm ci

      - name: Resolve version
        id: resolve_version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(curl -sf https://repo1.maven.org/maven2/io/github/bbobbogi/stream4j/maven-metadata.xml | grep -oP '(?<=<release>)[^<]+')
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build site
        working-directory: ./site
        env:
          VERSION: ${{ steps.resolve_version.outputs.version }}
        run: npm run build

      - name: Combine site + Javadoc
        run: |
          mkdir -p site/dist/javadoc
          cp -r build/docs/javadoc/* site/dist/javadoc/
          touch site/dist/.nojekyll

      - name: Deploy to gh-pages branch
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'deploy: ${{ github.sha }}'
